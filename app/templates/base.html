<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Mittari{% endblock %} - Lajitietokeskuksen testisivusto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header>
      <a href="{{ url_for('main.index') }}">Mittari - Kokeilukäytössä olevia tilastointeja</a>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <script defer src="{{ url_for('static', filename='js/taxon_select.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/year_select.js') }}"></script>
    {% block scripts %}{% endblock %}

    <footer>
      <a href="https://laji.fi/">Suomen Lajitietokeskus</a> - Tämä sivusto ei kerää henkilötietoja eikä käyttäjätilastoja.
    </footer>
  </body>
</html>
